name: Auto-standardize source and docs
on:
  push:
    branches: [feat/auto-standardization]
permissions:
  contents: write
jobs:
  standardize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auto-standardization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply tracked text renames
        run: node scripts/auto-standardize.mjs
      - name: Commit standardized files only on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: standardize legacy brand labels"
            git push origin HEAD:feat/auto-standardization
          fi
